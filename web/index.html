<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daisy Pod</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Daisy Pod</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="app-name" id="app-name"></span>
      </div>
      <div class="connection">
        <span class="status" id="status" data-state="off" role="status"
          ><span class="status-text">Not connected</span><span class="status-port" id="status-port"></span
        ></span>
        <details class="ports" id="ports">
          <summary class="button">MIDI ports</summary>
          <div class="ports-panel">
            <label>In <select id="input" aria-label="MIDI input from the Pod"></select></label>
            <label>Out <select id="output" aria-label="MIDI output to the Pod"></select></label>
          </div>
        </details>
        <button type="button" id="connect" class="button">Connect</button>
      </div>
    </header>

    <main>
      <p class="notice" id="notice" hidden></p>

      <section class="scope" id="scope" aria-label="Sample buffer">
        <div class="panel-head">
          <h2>Buffer</h2>
          <div class="legend" aria-hidden="true">
            <span data-legend="speed"><i class="sw sw-slow"></i>slower</span>
            <span data-legend="speed"><i class="sw sw-unity"></i>normal</span>
            <span data-legend="speed"><i class="sw sw-fast"></i>faster</span>
            <span data-legend="tap"><i class="sw sw-tap"></i>delay tap</span>
            <span data-legend="onset"><i class="sw sw-onset"></i>note</span>
          </div>
          <span class="panel-meta" id="scope-meta" hidden></span>
          <div class="segmented span" role="group" aria-label="Time shown">
            <button type="button" data-span="2" aria-pressed="false">2 s</button>
            <button type="button" data-span="8" aria-pressed="true">8 s</button>
            <button type="button" data-span="22" aria-pressed="false">All</button>
          </div>
        </div>
        <canvas id="buffer" class="buffer" role="img"
          aria-label="The sample buffer over time, with the voices and delay taps reading from it"></canvas>
      </section>

      <section class="scope" id="trace-panel" aria-label="Traces" hidden>
        <div class="panel-head">
          <h2 id="trace-title">Traces</h2>
          <div class="segmented span" role="group" aria-label="Time shown">
            <button type="button" data-trace-span="2" aria-pressed="false">2 s</button>
            <button type="button" data-trace-span="8" aria-pressed="true">8 s</button>
            <button type="button" data-trace-span="20" aria-pressed="false">20 s</button>
          </div>
        </div>
        <canvas id="traces" class="traces" role="img" aria-label="Values over time"></canvas>
      </section>

      <section class="readouts">
        <div class="readout" id="tempo" hidden></div>
        <div class="readout" id="xy" hidden>
          <div class="panel-head"><h2 id="xy-title"></h2><span class="panel-meta">in against out</span></div>
          <canvas class="xy-plot" role="img" aria-label="Input against output"></canvas>
        </div>
        <div class="readout" id="levels"></div>
        <div class="readout" id="cpu"></div>
      </section>

      <section class="group presets" id="presets" aria-label="Presets" hidden>
        <div class="group-head">
          <h2>Presets</h2>
          <span class="panel-meta"></span>
          <button type="button" class="button preset-save">Save</button>
          <button type="button" class="button preset-reset">Factory reset</button>
        </div>
        <div class="segmented options preset-slots" role="group" aria-label="Preset slots"></div>
      </section>

      <section class="controls" id="controls" aria-label="Controls"></section>
    </main>
  </body>
</html>
