<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daisy Pod</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <span class="brand-pod">Daisy Pod</span>
        <h1 class="app-name" id="app-name">Daisy Pod</h1>
        <span class="app-tagline" id="app-tagline"></span>
      </div>
      <div class="header-extra" id="header-extra"></div>
      <section class="presets" id="presets" aria-label="Presets" hidden>
        <span class="label">Preset</span>
        <div class="preset-slots" role="group" aria-label="Preset slots"></div>
        <button type="button" class="button preset-save">Save</button>
        <span class="preset-meta" role="status"></span>
      </section>
      <div class="connection">
        <span class="status" id="status" data-state="off" role="status"
          ><span class="status-text">Not connected</span></span
        >
        <details class="setup" id="setup">
          <summary class="button">Setup</summary>
          <div class="setup-panel">
            <label>In <select id="input" aria-label="MIDI input from the Pod"></select></label>
            <label>Out <select id="output" aria-label="MIDI output to the Pod"></select></label>
            <button type="button" id="connect" class="button">Connect</button>
            <button type="button" class="button button-quiet preset-reset" id="preset-reset" hidden>Factory reset…</button>
          </div>
        </details>
      </div>
    </header>

    <main class="surface" id="surface">
      <p class="notice" id="notice" hidden></p>

      <div class="side">
        <section class="display" id="display" aria-label="What the Pod is doing">
          <div class="display-head">
            <h2 id="display-title">Waiting for the Pod</h2>
            <span class="display-meta" id="display-meta"></span>
          </div>
          <canvas class="scope" id="scope" role="img" hidden
            aria-label="The sample buffer over time, with the voices and delay taps reading from it"></canvas>
          <canvas class="trace-strip" id="traces" role="img" hidden aria-label="Values over time"></canvas>
          <div class="display-row">
            <canvas class="xy" id="xy" role="img" hidden aria-label="Input against output"></canvas>
            <div class="meters" id="levels"></div>
          </div>
          <div class="tempo" id="tempo" hidden></div>
          <div class="display-foot">
            <span class="readouts" id="readouts">Plug the Pod in by USB, running an app.</span>
            <span class="cpu" id="cpu"></span>
          </div>
        </section>
        <nav class="rail" id="rail" aria-label="Sections" hidden></nav>
      </div>

      <div class="feature" id="feature"></div>
      <div class="below" id="below"></div>
    </main>
  </body>
</html>
